name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e 'backend[dev,ml]'
      - run: python -m pytest backend/tests -q
  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    needs: [backend, frontends]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t protocolguard-ci .
      - name: Verify production image serves both apps and API
        run: |
          docker run -d --name protocolguard-ci -p 127.0.0.1:10000:10000 -e CORS_ORIGINS=https://example.com -e IP_AUTO_RESTRICT_ENABLED=false protocolguard-ci
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:10000/api/health
          curl --fail http://127.0.0.1:10000/login
          curl --fail http://127.0.0.1:10000/admin/users
      - name: Container logs
        if: failure()
        run: docker logs protocolguard-ci
      - name: Cleanup
        if: always()
        run: docker rm -f protocolguard-ci
