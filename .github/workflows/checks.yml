name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-only-password
          POSTGRES_DB: protocolguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROTOCOLGUARD_TEST_POSTGRES_URL: postgresql://postgres:local-test-only-password@127.0.0.1:5432/protocolguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e 'backend[dev,ml,postgres]'
      - run: python -m pytest backend/tests -q
  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:proxy
      - run: npm run build:vercel
  container:
    runs-on: ubuntu-latest
    needs: [backend, frontends]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/all-in-one.Dockerfile -t protocolguard-ci .
      - name: Verify production image serves both apps and API
        run: |
          docker run -d --name protocolguard-ci -p 127.0.0.1:10000:10000 -e CORS_ORIGINS=https://example.com -e IP_AUTO_RESTRICT_ENABLED=false protocolguard-ci
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors --connect-timeout 2 --max-time 5 --retry-max-time 60 http://127.0.0.1:10000/api/health
          curl --fail http://127.0.0.1:10000/login
          curl --fail http://127.0.0.1:10000/admin/users
      - name: Container logs
        if: failure()
        run: docker logs protocolguard-ci
      - name: Cleanup
        if: always()
        run: docker rm -f protocolguard-ci
  railway-container:
    runs-on: ubuntu-latest
    needs: [backend, frontends]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/railway.Dockerfile -t protocolguard-railway-ci .
      - name: Verify API-only image
        run: |
          docker run -d --name protocolguard-railway-ci -p 127.0.0.1:10000:10000 -e CORS_ORIGINS=https://example.vercel.app protocolguard-railway-ci
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors --connect-timeout 2 --max-time 5 --retry-max-time 60 http://127.0.0.1:10000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/)" = "404"
      - name: Container logs
        if: failure()
        run: docker logs protocolguard-railway-ci
      - name: Cleanup
        if: always()
        run: docker rm -f protocolguard-railway-ci
  postgres-container:
    runs-on: ubuntu-latest
    needs: [backend, frontends]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/postgres.Dockerfile -t protocolguard-postgres-ci .
      - name: Verify API startup against persistent PostgreSQL
        run: |
          docker network create protocolguard-ci
          docker run -d --name database --network protocolguard-ci -e POSTGRES_PASSWORD=local-test-only-password -e POSTGRES_DB=protocolguard_test postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec database pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker run -d --name protocolguard-postgres-ci --network protocolguard-ci -p 127.0.0.1:10000:10000 -e DATABASE_URL=postgresql://postgres:local-test-only-password@database:5432/protocolguard_test -e CORS_ORIGINS=https://example.vercel.app protocolguard-postgres-ci
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors --connect-timeout 2 --max-time 5 --retry-max-time 60 http://127.0.0.1:10000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/)" = "404"
      - name: Container logs
        if: failure()
        run: docker logs protocolguard-postgres-ci
      - name: Cleanup
        if: always()
        run: |
          docker rm -f protocolguard-postgres-ci database
          docker network rm protocolguard-ci
